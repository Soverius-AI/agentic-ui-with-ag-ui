<main
  class="macro-shell min-h-dvh bg-base-200 text-base-content xl:grid xl:h-dvh xl:grid-cols-[minmax(0,1fr)_minmax(380px,30rem)] xl:gap-6 xl:overflow-hidden xl:p-6"
>
  <section
    class="flex min-w-0 flex-col gap-8 p-4 sm:p-6 xl:min-h-0 xl:overflow-y-auto xl:p-0"
    aria-label="MacroQuest dashboard"
  >
    <mq-dashboard
      [goals]="store.goals()"
      [totals]="store.dailyTotals()"
      [remaining]="store.remaining()"
      [questProgress]="store.questProgress()"
      [macroScore]="store.macroScore()"
      [meals]="store.activeMeals()"
      [selectedMealId]="store.selectedMealId()"
      [dayLabel]="store.dayLabel()"
      (resetDemo)="store.resetDemo()"
      (mealSelected)="store.selectMeal($event)"
    />

    <mq-meal-timeline
      [meals]="store.activeMeals()"
      [dayLabel]="store.dayLabel()"
      [canGoNextDay]="store.canGoNextDay()"
      (mealSelected)="store.selectMeal($event)"
      (servingsChanged)="store.updateServings($event)"
      (titleChanged)="store.renameMeal($event.mealId, $event.title)"
      (itemEdited)="store.updateFoodItem($event)"
      (mealConfirmed)="store.confirmMeal($event)"
      (previousDay)="store.showPreviousDay()"
      (nextDay)="store.showNextDay()"
    />
  </section>

  <aside
    class="copilot-panel m-4 flex min-h-150 flex-col overflow-hidden rounded-2xl border border-base-300/70 bg-base-100 shadow-xl sm:m-6 xl:m-0 xl:min-h-0"
    aria-label="MacroQuest copilot"
  >
    <mq-demo-meal-plates [chat]="chat()" />

    <div class="min-h-0 flex-1 bg-base-100 p-3">
      <copilot-chat [attachments]="store.mealPhotoAttachments" />
    </div>
  </aside>
</main>
